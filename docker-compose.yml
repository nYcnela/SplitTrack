services:
  db:
    image: postgres:16
    container_name: splittrack-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splittrack} -d ${POSTGRES_DB:-splittrack}"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splittrack}
      POSTGRES_USER: ${POSTGRES_USER:-splittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splittrack}
    volumes:
      - splittrack_db:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: splittrack-backend:latest
    container_name: splittrack-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-splittrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-splittrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-splittrack}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      APP_UPLOADS_DIR: /app/uploads
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-10MB}
      APP_OCR_ENABLED: ${APP_OCR_ENABLED:-true}
      APP_OCR_PROVIDER: ${APP_OCR_PROVIDER:-tesseract}
      APP_OCR_COMMAND: ${APP_OCR_COMMAND:-tesseract}
      APP_OCR_LANGUAGE: ${APP_OCR_LANGUAGE:-pol+eng}
      APP_OCR_PAGE_SEGMENTATION_MODE: ${APP_OCR_PAGE_SEGMENTATION_MODE:-6}
      APP_OCR_TIMEOUT_SECONDS: ${APP_OCR_TIMEOUT_SECONDS:-45}
      APP_OCR_MAX_ITEMS: ${APP_OCR_MAX_ITEMS:-40}
      APP_OCR_TABSCANNER_API_BASE_URL: ${APP_OCR_TABSCANNER_API_BASE_URL:-https://api.tabscanner.com}
      APP_OCR_TABSCANNER_API_KEY: ${APP_OCR_TABSCANNER_API_KEY:-}
      APP_OCR_TABSCANNER_REGION: ${APP_OCR_TABSCANNER_REGION:-pl}
      APP_OCR_TABSCANNER_DOCUMENT_TYPE: ${APP_OCR_TABSCANNER_DOCUMENT_TYPE:-receipt}
      APP_OCR_TABSCANNER_DEFAULT_DATE_PARSING: ${APP_OCR_TABSCANNER_DEFAULT_DATE_PARSING:-d/m}
      APP_OCR_TABSCANNER_POLL_DELAY_MILLIS: ${APP_OCR_TABSCANNER_POLL_DELAY_MILLIS:-1000}
      APP_OCR_TABSCANNER_MAX_POLL_ATTEMPTS: ${APP_OCR_TABSCANNER_MAX_POLL_ATTEMPTS:-12}
      APP_RECEIPT_ANALYZER_BASE_URL: ${APP_RECEIPT_ANALYZER_BASE_URL:-http://receipt-insights:8000}
      APP_RECEIPT_ANALYZER_ANALYZE_PATH: ${APP_RECEIPT_ANALYZER_ANALYZE_PATH:-/receipt/analyze}
      APP_RECEIPT_ANALYZER_LLM_TYPE: ${APP_RECEIPT_ANALYZER_LLM_TYPE:-light}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - splittrack_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      receipt-insights:
        condition: service_healthy
    restart: unless-stopped

  receipt-insights:
    build:
      context: ../receipt-insights
      dockerfile: Dockerfile
    image: receipt-insights:splittrack-api
    container_name: receipt-insights-splittrack-api
    env_file:
      - ../receipt-insights/.env
    ports:
      - "${RECEIPT_INSIGHTS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    image: splittrack-frontend:latest
    container_name: splittrack-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  splittrack_db:
  splittrack_uploads:
