server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splittrack}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:30MB}
      max-request-size: ${APP_MAX_UPLOAD_SIZE:30MB}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  password: ${APP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  default-currency: PLN
  uploads-dir: ${APP_UPLOADS_DIR:uploads}
  max-upload-size: ${APP_MAX_UPLOAD_SIZE:30MB}
  ocr:
    enabled: ${APP_OCR_ENABLED:true}
    timeout-seconds: ${APP_OCR_TIMEOUT_SECONDS:180}
    max-items: ${APP_OCR_MAX_ITEMS:200}
    receipt-analyzer:
      base-url: ${APP_RECEIPT_ANALYZER_BASE_URL:http://localhost:8000}
      analyze-path: ${APP_RECEIPT_ANALYZER_ANALYZE_PATH:/receipt/analyze}
      llm-type: ${APP_RECEIPT_ANALYZER_LLM_TYPE:light}
